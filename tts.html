<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Text-to-Speech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 sm:p-7 space-y-5">
        <h1 class="text-lg font-semibold text-slate-900 tracking-tight">Text to Speech</h1>

        <div>
            <textarea
                id="text-input"
                rows="4"
                placeholder="Type something to speak..."
                class="w-full rounded-xl border border-slate-200 bg-slate-50/50 p-3.5 text-sm sm:text-base text-slate-800 placeholder-slate-400 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none resize-y transition"
            >Hello! Type anything here, pick a voice, adjust the sliders, and click Play or Download.</textarea>
        </div>

        <div>
            <label for="voice-select" class="block text-xs font-medium text-slate-500 mb-1.5">Voice</label>
            <select
                id="voice-select"
                class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-3.5 py-2.5 text-sm text-slate-800 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 focus:outline-none transition"
            >
                <option value="">Loading voices...</option>
            </select>
        </div>

        <div class="space-y-4 pt-1">
            <div>
                <div class="flex justify-between text-xs font-medium mb-1">
                    <label for="speed-slider" class="text-slate-600">Speed</label>
                    <span id="speed-val" class="text-slate-900 tabular-nums">1.0x</span>
                </div>
                <input id="speed-slider" type="range" min="0.5" max="2" step="0.1" value="1" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
            </div>

            <div>
                <div class="flex justify-between text-xs font-medium mb-1">
                    <label for="pitch-slider" class="text-slate-600">Pitch</label>
                    <span id="pitch-val" class="text-slate-900 tabular-nums">1.0</span>
                </div>
                <input id="pitch-slider" type="range" min="0.5" max="2" step="0.1" value="1" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
            </div>

            <div>
                <div class="flex justify-between text-xs font-medium mb-1">
                    <label for="volume-slider" class="text-slate-600">Volume</label>
                    <span id="volume-val" class="text-slate-900 tabular-nums">100%</span>
                </div>
                <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-600">
            </div>
        </div>

        <div class="grid grid-cols-3 gap-2.5 pt-2">
            <button
                id="play-btn"
                type="button"
                class="py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white text-sm font-medium transition cursor-pointer"
            >
                Play
            </button>

            <button
                id="stop-btn"
                type="button"
                class="py-2.5 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-[0.99] text-slate-700 text-sm font-medium transition cursor-pointer"
            >
                Stop
            </button>

            <button
                id="download-btn"
                type="button"
                class="py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white text-sm font-medium transition cursor-pointer"
            >
                Download
            </button>
        </div>

        <p id="status-msg" class="text-xs text-center text-slate-500 min-h-[1.25rem]"></p>
    </main>

    <script>
        const synth = window.speechSynthesis;
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');

        const speedSlider = document.getElementById('speed-slider');
        const pitchSlider = document.getElementById('pitch-slider');
        const volumeSlider = document.getElementById('volume-slider');

        const speedVal = document.getElementById('speed-val');
        const pitchVal = document.getElementById('pitch-val');
        const volumeVal = document.getElementById('volume-val');

        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const downloadBtn = document.getElementById('download-btn');
        const statusMsg = document.getElementById('status-msg');

        let voices = [];

        function setStatus(msg) {
            statusMsg.textContent = msg;
        }

        function loadVoices() {
            voices = synth.getVoices();
            if (!voices.length) return;

            const current = voiceSelect.value;
            voiceSelect.innerHTML = '';

            voices.forEach((voice, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${voice.name} (${voice.lang})`;
                voiceSelect.appendChild(option);
            });

            if (current && voices[current]) {
                voiceSelect.value = current;
            } else {
                const defaultIdx = voices.findIndex(v => v.default && v.lang.startsWith('en'));
                if (defaultIdx >= 0) voiceSelect.value = defaultIdx;
            }
        }

        loadVoices();
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = loadVoices;
        }

        speedSlider.addEventListener('input', () => {
            speedVal.textContent = `${parseFloat(speedSlider.value).toFixed(1)}x`;
        });
        pitchSlider.addEventListener('input', () => {
            pitchVal.textContent = parseFloat(pitchSlider.value).toFixed(1);
        });
        volumeSlider.addEventListener('input', () => {
            volumeVal.textContent = `${Math.round(parseFloat(volumeSlider.value) * 100)}%`;
        });

        function createUtterance(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            const selectedVoice = voices[voiceSelect.value];
            if (selectedVoice) utterance.voice = selectedVoice;
            utterance.rate = parseFloat(speedSlider.value);
            utterance.pitch = parseFloat(pitchSlider.value);
            utterance.volume = parseFloat(volumeSlider.value);
            return utterance;
        }

        // Play TTS
        playBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                setStatus('Enter some text first.');
                textInput.focus();
                return;
            }

            synth.cancel();
            const utterance = createUtterance(text);
            utterance.onstart = () => setStatus('Speaking...');
            utterance.onend = () => setStatus('');
            utterance.onerror = () => setStatus('');
            synth.speak(utterance);
        });

        // Stop TTS
        stopBtn.addEventListener('click', () => {
            synth.cancel();
            setStatus('');
        });

        // Capture & Download Real Browser TTS Voice
        downloadBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            if (!text) {
                setStatus('Enter some text first.');
                textInput.focus();
                return;
            }

            try {
                setStatus('Select "This Tab" and turn ON "Share tab audio" in the popup...');
                
                // Request tab audio capture
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: true,
                    audio: true
                });

                const audioTracks = stream.getAudioTracks();
                if (audioTracks.length === 0) {
                    stream.getTracks().forEach(t => t.stop());
                    setStatus('No audio shared! Make sure to check "Share tab audio".');
                    return;
                }

                // Stop video track immediately since we only want audio
                stream.getVideoTracks().forEach(t => t.stop());

                const audioStream = new MediaStream(audioTracks);
                const mediaRecorder = new MediaRecorder(audioStream);
                const chunks = [];

                mediaRecorder.ondataavailable = (e
