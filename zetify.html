    <style>
        :root {
            --text: #e0e0e0;
            --text-muted: #aaaaaa;
            --bg: #0a0a0a;
            --surface: #1a1a1a;
            --surface-hover: #252525;
            --border: #333333;
            --glass: rgba(26, 26, 26, 0.95);
            --radius: 9999px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        /* Google-like Top Bar */
        #topBar {
            background: #000000;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 110;
            backdrop-filter: blur(20px);
            padding: 8px 0;
        }

        .top-content {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .logo {
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            cursor: pointer;
        }

        .search-container {
            flex: 1;
            max-width: 620px;
        }

        #searchBar {
            width: 100%;
            padding: 13px 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 16px;
            outline: none;
            box-shadow: 0 1px 6px rgba(0,0,0,0.3);
        }

        #searchBar:focus {
            border-color: #ffffff;
            box-shadow: 0 1px 8px rgba(255,255,255,0.15);
        }

        .refresh-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            color: white;
            background: var(--surface-hover);
        }

        .refresh-btn.spinning {
            animation: cartwheelSpin 0.9s linear;
        }

        @keyframes cartwheelSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Announcement Bar */
        #announcementBar {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
            text-align: center;
            padding: 10px 20px;
            font-size: 14.5px;
            position: sticky;
            top: 58px;
            z-index: 109;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #announcementBar strong {
            color: white;
        }

        #announcementBar .dismiss-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 11px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        #announcementBar .dismiss-btn:hover {
            border-color: white;
            color: white;
        }

        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 30px 20px 100px;
        }

        #container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
        }

        .zone-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(30px);
        }

        .zone-item.visible {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .zone-item:hover {
            transform: translateY(-8px);
            border-color: #ffffff;
            box-shadow: 0 15px 30px rgba(255,255,255,0.1);
        }

        .zone-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .zone-item:hover img {
            transform: scale(1.08);
        }

        .zone-item button {
            width: 100%;
            padding: 14px 12px;
            background: transparent;
            border: none;
            color: var(--text);
            font-weight: 600;
            font-size: 15px;
            text-align: center;
            cursor: pointer;
        }

        .zone-item:hover button {
            color: white;
        }

        #zoneViewer {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .zone-header {
            background: #111;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .zone-controls button {
            background: #222;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            margin-left: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .zone-controls button:hover {
            background: white;
            color: black;
        }

        #zoneFrame {
            flex: 1;
            border: none;
        }

        @media (max-width: 768px) {
            #container {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                gap: 18px;
            }
        }
    </style>

    <!-- Zone Viewer -->
    <div id="zoneViewer">
        <div class="zone-header">
            <h2 id="zoneName">Game Title</h2>
            <div class="zone-controls">
                <button onclick="fullscreenZone()">Fullscreen</button>
                <button onclick="aboutBlank()">Open in New Tab</button>
                <button onclick="downloadZone()">Download</button>
                <button onclick="closeZone()">Close</button>
            </div>
        </div>
        <iframe id="zoneFrame"></iframe>
    </div>

    <script>
        const container = document.getElementById('container');
        const zoneViewer = document.getElementById('zoneViewer');
        const zoneFrame = document.getElementById('zoneFrame');
        const searchBar = document.getElementById('searchBar');
        const refreshBtn = document.getElementById('refreshBtn');
        const coverURL = 'https://raw.githubusercontent.com/freebuisness/covers/main';
        const htmlURL = 'https://raw.githubusercontent.com/freebuisness/html/main';
        const zonesurls = [
            'https://raw.githubusercontent.com/freebuisness/assets/main/zones.json',
            'https://raw.githubusercontent.com/freebuisness/assets/latest/zones.json',
            'https://raw.githubusercontent.com/freebuisness/assets/master/zones.json'
        ];
        const newestLinks = {
            id: 676767,
            name: 'Newest Links!',
            cover: 'https://edugist.org/wp-content/uploads/2024/08/Best-Poki-Games-in-2023-copy.webp',
            url: 'https://padlet.com/ev1l/evil'
        };
        let zones = [];
        let currentZone = null;
        let loadingGeneration = 0;

        function resolveGameURL(value) {
            if (!value || typeof value !== 'string') return '';
            const expanded = value.replaceAll('{COVER_URL}', coverURL).replaceAll('{HTML_URL}', htmlURL).trim();
            try { return new URL(expanded, document.baseURI).href; }
            catch { return ''; }
        }

        function isHiddenGame(zone) {
            if (!zone || !zone.name) return true;
            const name = zone.name.toUpperCase();
            return name.includes('[!] COMMENTS') || name.includes('SUGGEST GAMES') || zone.id === -1 || zone.id === 596;
        }

        async function fetchGameCatalog() {
            let lastError;
            for (const url of zonesurls) {
                try {
                    const response = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
                    if (!response.ok) throw new Error('Catalog HTTP ' + response.status);
                    const json = await response.json();
                    if (!Array.isArray(json)) throw new Error('Invalid games catalog');
                    return json;
                } catch (error) { lastError = error; }
            }
            throw lastError || new Error('Game catalog could not be retrieved');
        }

        async function listZones() {
            refreshBtn.classList.add('spinning');
            try {
                const games = await fetchGameCatalog();
                zones = [newestLinks, ...games.filter(zone => !isHiddenGame(zone))];
                displayZones(zones);
            } catch (error) {
                console.error('Catalog loading failed:', error);
                if (zones.length === 0) {
                    const warning = document.createElement('div');
                    warning.textContent = 'Game catalog could not be loaded. Check the hosting connection and refresh.';
                    warning.style.cssText = 'padding:16px;color:#fff;background:#422;border-radius:12px;grid-column:1/-1';
                    container.prepend(warning);
                }
            } finally {
                setTimeout(() => refreshBtn.classList.remove('spinning'), 900);
            }
        }

        function displayZones(zonesToShow) {
            container.replaceChildren();
            const fragment = document.createDocumentFragment();
            zonesToShow.forEach(file => fragment.appendChild(createZoneItem(file)));
            container.appendChild(fragment);
            requestAnimationFrame(() => {
                container.querySelectorAll('.zone-item').forEach(item => item.classList.add('visible'));
            });
        }

        function createZoneItem(file) {
            const item = document.createElement('div');
            item.className = 'zone-item';
            item.onclick = () => openZone(file);
            const img = document.createElement('img');
            img.src = resolveGameURL(file.cover);
            img.alt = file.name;
            img.loading = 'lazy';
            item.appendChild(img);
            const button = document.createElement('button');
            button.textContent = file.name;
            item.appendChild(button);
            return item;
        }

        function filterZones() {
            const search = searchBar.value.toLowerCase().trim();
            displayZones(zones.filter(zone => zone.name.toLowerCase().includes(search)));
        }

        function rawHTMLURL(url) {
            try {
                const parsed = new URL(url);
                return parsed.hostname === 'raw.githubusercontent.com' || parsed.pathname.toLowerCase().endsWith('.html') || parsed.pathname.toLowerCase().endsWith('.htm');
            } catch { return false; }
        }

        async function getGameHTML(url) {
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) throw new Error('Game HTTP ' + response.status);
            const html = await response.text();
            if (!/<(?:!doctype\s+html|html\b|head\b|body\b|script\b)/i.test(html)) throw new Error('The link did not return an HTML game');
            return html;
        }

        function withBase(html, url) {
            const base = '<base href="' + url.replaceAll('&','&amp;').replaceAll('"','&quot;') + '">';
            if (/<base\s/i.test(html)) return html;
            if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, match => match + base);
            return '<head>' + base + '</head>' + html;
        }

        async function openZone(file) {
            const url = resolveGameURL(file.url);
            if (!url) { alert('This game has no valid link.'); return; }
            currentZone = file;
            const generation = ++loadingGeneration;
            document.getElementById('zoneName').textContent = file.name;
            zoneViewer.style.display = 'flex';
            zoneFrame.removeAttribute('src');
            zoneFrame.srcdoc = '<!doctype html><html><body style="background:#111;color:white;font:16px Arial;padding:30px">Loading game…</body></html>';
            try {
                if (rawHTMLURL(url)) {
                    const html = await getGameHTML(url);
                    if (generation !== loadingGeneration) return;
                    zoneFrame.srcdoc = withBase(html, url);
                } else {
                    zoneFrame.removeAttribute('srcdoc');
                    zoneFrame.src = url;
                }
            } catch (error) {
                console.error('Failed to load', file.name, url, error);
                if (generation !== loadingGeneration) return;
                zoneFrame.srcdoc = '<!doctype html><html><body style="background:#111;color:white;font:16px Arial;padding:30px"><h2>Game failed to load</h2><p>Try Open in New Tab. Some sites block embedded play or cross-origin requests.</p></body></html>';
            }
        }

        function closeZone() {
            ++loadingGeneration;
            zoneViewer.style.display = 'none';
            zoneFrame.removeAttribute('srcdoc');
            zoneFrame.removeAttribute('src');
            currentZone = null;
        }

        async function aboutBlank() {
            if (!currentZone) return;
            const url = resolveGameURL(currentZone.url);
            if (!url) return;
            const tab = window.open('about:blank', '_blank');
            if (!tab) { alert('Pop-up blocked. Allow pop-ups for this site.'); return; }
            try {
                if (rawHTMLURL(url)) {
                    const html = await getGameHTML(url);
                    if (tab.closed) return;
                    tab.document.open();
                    tab.document.write(withBase(html, url));
                    tab.document.close();
                } else {
                    tab.location.replace(url);
                }
            } catch (error) {
                console.error(error);
                if (!tab.closed) tab.location.replace(url);
            }
        }

        async function downloadZone() {
            if (!currentZone) return;
            const url = resolveGameURL(currentZone.url);
            if (!url) return;
            try {
                const html = await getGameHTML(url);
                const blob = new Blob([withBase(html, url)], {type:'text/html'});
                const link = document.createElement('a');
                const blobURL = URL.createObjectURL(blob);
                link.href = blobURL;
                link.download = currentZone.name.replace(/[\\/:*?"<>|]/g, '_') + '.html';
                link.click();
                setTimeout(() => URL.revokeObjectURL(blobURL), 30000);
            } catch(error) { console.error(error); alert('Download failed.'); }
        }

        function fullscreenZone() {
            if (zoneFrame.requestFullscreen) zoneFrame.requestFullscreen();
        }

        refreshBtn.addEventListener('click', listZones);
        listZones();
    </script>

</body></html>
