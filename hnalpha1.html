<title>HelloNeighborAlpha1 Webport</title>

<style>
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
canvas { position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%; aspect-ratio: 1280 / 720; width: 100%; height: auto; outline: none; }
@media (min-aspect-ratio: 1280 / 720) { canvas { width: auto; height: 100%; } }

#fps { position: fixed; left: 8px; top: 6px; font: 600 13px ui-monospace, Consolas, monospace; color: #e8e8e8; background: #000a; padding: 2px 6px; border-radius: 4px; pointer-events: none; display: none; }

<body>

<script>
(() => {
  const el = document.getElementById("fps");
  let on = false;
  try { const v = localStorage.getItem("uewFps"); if (v !== null) on = v === "1"; } catch (e) {}
  const q = new URLSearchParams(location.search).get("fps");
  if (q !== null) on = q !== "0";
  const show = () => { el.style.display = on ? "block" : "none"; };
  show();
  addEventListener("keydown", e => {
    if (e.ctrlKey && e.shiftKey && e.code === "KeyF") {
      on = !on; show();
      try { localStorage.setItem("uewFps", on ? "1" : "0"); } catch (err) {}
      e.preventDefault(); e.stopImmediatePropagation();
    }
  }, true);
  let last = performance.now(), frames = 0, worst = 0, prev = 0, prevT = last;
  const tick = now => {
    const n = (window.Module && Module.uewPresents) || 0;
    if (n !== prev) { worst = Math.max(worst, now - prevT); prev = n; prevT = now; }
    if (now - last >= 500) {
      const fps = (n - frames) * 1000 / (now - last);
      if (on) el.textContent = `${fps.toFixed(0)} FPS  ${fps ? (1000 / fps).toFixed(1) : "-"} ms  worst ${worst.toFixed(0)} ms`;
      frames = n; last = now; worst = 0;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
})();
</script>
<script>
const BASE = "https://raw.githubusercontent.com/IordBeerus/hello-neighbor-Alpha-1-Port/main/";
const asset = path => BASE + path;
const status = document.getElementById("status");

if (new URLSearchParams(location.search).get("perf") !== "high") {
  const nl = "\n";
  const engine = "[/SystemSettings]" + nl + [

  const user = "[ScalabilityGroups]" + nl + [
    "sg.ResolutionQuality=60", "sg.ViewDistanceQuality=0", "sg.AntiAliasingQuality=0", "sg.ShadowQuality=0",
    "sg.PostProcessQuality=0", "sg.TextureQuality=2", "sg.EffectsQuality=0", "sg.FoliageQuality=0"].join(nl) + nl;
  const dir = "Users/Player/AppData/Local/HelloNeighborReborn/Saved/Config/";
  for (const plat of ["WindowsNoEditor", "Windows"]) {
    Module.uewSeed[dir + plat + "/Engine.ini"] = engine;
    Module.uewSeed[dir + plat + "/GameUserSettings.ini"] = user;
  }
}
Module.instantiateWasm = (imports, done) => {
  let got = 0;
  const res = parts.map(u => fetch(asset(u)));
  const body = new ReadableStream({
    async start(ctl) {
      try {
        for (let i = 0; i < res.length; i++) {
          const r = await res[i];
          if (!r.ok) throw new Error(`HTTP ${r.status} for ${parts[i]}`);
          const rd = r.body.getReader();
          for (;;) {
            const { done: end, value } = await rd.read();
            if (end) break;
            got += value.length;
            status.textContent = `Loading code ${Math.round(got / 1048576)} MB`;
            ctl.enqueue(value);
          }
        }
        status.textContent = "Compiling…";
        ctl.close();
      } catch (e) {
        status.textContent = "Failed to load code: " + e.message;
        ctl.error(e);
      }
    }
  });
  WebAssembly.instantiateStreaming(new Response(body, { headers: { "Content-Type": "application/wasm" } }), imports)
    .then(r => done(r.instance, r.module))
    .catch(e => { status.textContent = "Failed to load: " + e.message; });
  return {};
};
</script>
